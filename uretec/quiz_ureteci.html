<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eğitici Akıllı Quiz Üreteci</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f4f6f9; }
        .container { display: flex; gap: 20px; min-height: 85vh; }
        .form-panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-y: auto; max-height: 85vh; }
        .preview-panel { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        label { font-weight: bold; margin-top: 10px; display: block; color: #0f172a; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { background: #0284c7; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #0369a1; }
        iframe { width: 100%; height: 100%; border: none; flex: 1; border-radius: 4px; background: #fff; }
        #previewContainer { width: 100%; flex: 1; border: 1px solid #ccc; margin-top: 10px; border-radius: 4px; overflow: hidden; display: flex; }
        #status { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; text-align: center; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #64748b; text-decoration: none; font-weight: bold; }
        .back-link:hover { color: #0284c7; }
    </style>
</head>
<body>

    <a href="../index.html" class="back-link">← Portala Dön</a>
    <h2>📝 Eğitici Akıllı Quiz (Sınav) Üreteci</h2>

    <div class="container">
        <!-- SOL PANEL -->
        <div class="form-panel">
            <label for="modelSelect">Model:</label>
            <select id="modelSelect">
                <option value="gemini-3.5-flash-lite" selected>gemini-3.5-flash-lite (Önerilen & Hızlı)</option>
                <option value="gemini-3.8-flash">gemini-3.8-flash (Yüksek Başarı)</option>
                <option value="gemini-3.6-flash">gemini-3.6-flash</option>
            </select>

            <label for="grade">Sınıf Düzeyi:</label>
            <select id="grade">
                <option value="5. Sınıf">5. Sınıf</option>
                <option value="6. Sınıf">6. Sınıf</option>
                <option value="7. Sınıf">7. Sınıf</option>
                <option value="8. Sınıf" selected>8. Sınıf</option>
            </select>

            <label for="subject">Ders / Konu Başlığı:</label>
            <input type="text" id="subject" placeholder="Örn: Matematik - Cebirsel İfadeler">

            <label for="questionCount">Soru Sayısı:</label>
            <select id="questionCount">
                <option value="5" selected>5 Soru (Hızlı Pratik)</option>
                <option value="10">10 Soru (Standart Sınav)</option>
                <option value="15">15 Soru (Kapsamlı Test)</option>
            </select>

            <label for="details">Özel İstekler / Odak Noktaları:</label>
            <textarea id="details" rows="3" placeholder="Örn: Yeni nesil beceri temelli sorular ağırlıklı olsun, günlük hayat problemleri içersin."></textarea>

            <button id="btnGenerate">🚀 Profesyonel Quiz Üret</button>
            <button id="btnDownload" style="background:#059669; margin-top: 10px;">💾 Quizi HTML Olarak İndir</button>
            <div id="status"></div>
        </div>

        <!-- SAĞ PANEL -->
        <div class="preview-panel">
            <h3>📱 Canlı Quiz Önizlemesi</h3>
            <div id="previewContainer">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        let lastGeneratedCode = "";

        function showStatus(msg, isError) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.style.background = isError ? '#f8d7da' : '#d4edda';
            statusDiv.style.color = isError ? '#721c24' : '#155724';
            statusDiv.innerText = msg;
        }

        async function generateToolWithRetry(endpoint, payload, retries = 3, delay = 3000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        const errMessage = data.error ? (typeof data.error === 'object' ? data.error.message : data.error) : "";
                        if ((response.status === 503 || errMessage.includes("high demand") || response.status === 429) && i < retries - 1) {
                            showStatus(`⚠️ Sunucu yoğun (Deneme ${i+1}/${retries}), bekleniyor...`, false);
                            await new Promise(res => setTimeout(res, delay));
                            continue;
                        }
                        throw new Error(errMessage || "API Hatası: " + response.status);
                    }
                    return data;
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay));
                }
            }
        }

        async function generateTool() {
            const modelName = document.getElementById('modelSelect').value;
            const grade = document.getElementById('grade').value;
            const subject = document.getElementById('subject').value;
            const qCount = document.getElementById('questionCount').value;
            const details = document.getElementById('details').value;
            const previewFrame = document.getElementById('previewFrame');

            if (!subject) {
                alert("Lütfen ders veya konu başlığını doldurun!");
                return;
            }

            showStatus("⏳ Yapay zeka quizi hazırlıyor...", false);
            
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write("<div style='font-family:sans-serif; text-align:center; padding-top:50px; color:#64748b;'><h3>📝 Yapay zeka soruları derliyor...</h3><p>Lütfen bekleyin...</p></div>");
            doc.close();

            const promptText = `
Sen uzman bir Eğitim Ölçme ve Değerlendirme Uzmanısın. Sana verilen bilgilere dayanarak, öğrencilerin bilgilerini pekiştireceği **tamamen etkileşimli, şık, şıklı ve detaylı açıklamalı bir quiz / test uygulaması** üreteceksin.

PARAMETRELER:
- Sınıf Düzeyi: ${grade}
- Konu / Ders: ${subject}
- Soru Sayısı: ${qCount}
- Özel İstekler / Odak Noktaları: ${details}

TASARIM VE YAZILIM KURALLARI:
1. GÖRSEL DİL VE STİL:
   - Modern, şık card tasarımı, üst kısımda anlık skor / doğru-yanlış sayacı.
   - Google Fontlar ('Fredoka' veya 'Nunito') kullanılmalı, renk paleti profesyonel eğitim tonlarında olmalı (--primary: #0284c7, --success: #16a34a, --danger: #dc2626).

2. QUIZ MEKANİĞİ:
   - Sorular listelenmeli veya adım adım (ileri/geri butonlu ya da tek sayfa modern akışlı) çözülebilmeli.
   - Her şıkka tıklandığında doğru ise yeşil, yanlış ise kırmızı renk almalı ve hemen altında **"Detaylı Çözüm / Açıklama"** kutusu animasyonlu veya temiz bir şekilde açılmalıdır.
   - Testin sonunda genel başarı yüzdesini ve skoru gösteren tebrik/özet ekranı (Modal veya kart) çıkmalı ve "Tekrar Çöz" butonu bulunmalıdır.
   - Asla ham LaTeX ($...$) kodu bırakılmayacak; matematiksel veya bilimsel simgeler doğrudan düzgün sembollerle (√, ², °, vb.) yazılacak.

3. TEKNİK GEREKSİNİMLER:
   - Tek bir dosyada birleşmiş pürüzsüz HTML, CSS ve JavaScript kodları. Harici kütüphane istemeyecek.

4. ÇIKTI FORMATI:
   - Yalnızca çalışan eksiksiz HAM HTML KODU döndür. Markdown (\`\`\`html vb.) kesinlikle kullanma.
`;

            try {
                const endpoint = '/api/generate';
                
                const payload = {
                    promptText: promptText,
                    modelName: modelName
                };

                const data = await generateToolWithRetry(endpoint, payload);

                if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error("Model geçerli yanıt üretmedi.");
                }

                let rawCode = data.candidates[0].content.parts[0].text;
                rawCode = rawCode.replace(/^```html/gi, '').replace(/^```/gi, '').replace(/```$/gi, '').trim();

                lastGeneratedCode = rawCode;

                doc.open();
                doc.write(lastGeneratedCode);
                doc.close();

                showStatus("🎉 Quiz başarıyla üretildi!", false);

            } catch (err) {
                console.error(err);
                showStatus("❌ Hata: " + err.message, true);
            }
        }

        function downloadHTML() {
            if (!lastGeneratedCode) {
                alert("Önce bir quiz üretmelisiniz.");
                return;
            }
            
            const subjectInput = document.getElementById('subject').value || "egitici_quiz";
            const safeName = subjectInput.replace(/[^a-z0-9ğüşıöçĞÜŞİÖÇ]/gi, '_').toLowerCase();
            
            const blob = new Blob([lastGeneratedCode], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${safeName}_quiz.html`;
            a.click();
        }

        document.getElementById('btnGenerate').addEventListener('click', generateTool);
        document.getElementById('btnDownload').addEventListener('click', downloadHTML);
    </script>
</body>
</html>
