<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eğitici Akıllı Atölye Üreteci</title>
    <style>
        :root { --workshop: #0284c7; --workshop-hover: #0369a1; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f8fafc; }
        .container { display: flex; gap: 20px; min-height: 85vh; }
        .form-panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-y: auto; max-height: 85vh; }
        .preview-panel { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        label { font-weight: bold; margin-top: 12px; display: block; color: #0f172a; font-size: 0.95rem; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
        .checkbox-container { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-weight: normal; font-size: 0.9rem; color: #475569; cursor: pointer; }
        .checkbox-container input { width: auto; margin-top: 0; cursor: pointer; }
        button { background: var(--workshop); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background: var(--workshop-hover); }
        iframe { width: 100%; height: 100%; border: none; flex: 1; border-radius: 4px; background: #fff; }
        #previewContainer { width: 100%; flex: 1; border: 1px solid #ccc; margin-top: 10px; border-radius: 4px; overflow: hidden; display: flex; }
        #status { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; text-align: center; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #64748b; text-decoration: none; font-weight: bold; }
        .back-link:hover { color: var(--workshop); }
    </style>
</head>
<body>

    <a href="../index.html" class="back-link">← Portala Dön</a>
    <h2>🛠️ Eğitici Akıllı Atölye Üreteci (Somutlaştırma Simülasyonları)</h2>

    <div class="container">
        <!-- SOL PANEL -->
        <div class="form-panel">
            <label for="modelSelect">Model Seçiniz:</label>
            <select id="modelSelect">
                <option value="gemini-3.5-flash-lite" selected>gemini-3.5-flash-lite (Önerilen & Hızlı)</option>
                <option value="gemini-3.8-flash">gemini-3.8-flash (Yüksek Başarı)</option>
                <option value="gemini-3.6-flash">gemini-3.6-flash</option>
            </select>

            <label for="grade">Sınıf Düzeyi:</label>
            <select id="grade">
                <option value="5. Sınıf">5. Sınıf</option>
                <option value="6. Sınıf">6. Sınıf</option>
                <option value="7. Sınıf">7. Sınıf</option>
                <option value="8. Sınıf" selected>8. Sınıf</option>
            </select>

            <label for="subject">Ders:</label>
            <select id="subject">
                <option value="Matematik" selected>📐 Matematik</option>
                <option value="Fen Bilimleri">⚗️ Fen Bilimleri</option>
                <option value="Sosyal Bilgiler">🌍 Sosyal Bilgiler</option>
                <option value="Türkçe">📖 Türkçe</option>
                <option value="İngilizce">🇬🇧 İngilizce</option>
                <option value="Din Kültürü ve Ahlak Bilgisi">🌙 Din Kültürü ve Ahlak Bilgisi</option>
                <option value="Bilişim Teknolojileri">💻 Bilişim Teknolojileri</option>
            </select>

            <label for="subtopic">Konu / Alt Başlık:</label>
            <input type="text" id="subtopic" placeholder="Örn: Kareköklü ifadeleri a kök b şeklinde yazma">

            <label for="concept">Atölye / Simülasyon Konsepti:</label>
            <input type="text" id="concept" placeholder="Örn: Kek dükkânı, arsa çitleme, ahşap kesme...">
            <label class="checkbox-container">
                <input type="checkbox" id="autoConcept" onchange="toggleConceptInput()"> Yapay zeka konsepti/senaryoyu kendisi seçsin
            </label>

            <label for="details">Ekstra Özel İstekler (Opsiyonel):</label>
            <textarea id="details" rows="2" placeholder="Örn: Görsel elemanlar ağırlıklı olsun, müşteri tipleri değişsin..."></textarea>

            <button id="btnGenerate">🚀 İnteraktif Atölye Üret</button>
            <button id="btnDownload" style="background:#059669; margin-top: 10px;">💾 Atölyeyi HTML Olarak İndir</button>
            <div id="status"></div>
        </div>

        <!-- SAĞ PANEL -->
        <div class="preview-panel">
            <h3>📱 Canlı Atölye Önizlemesi</h3>
            <div id="previewContainer">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        let lastGeneratedCode = "";

        function toggleConceptInput() {
            const isChecked = document.getElementById('autoConcept').checked;
            const conceptInput = document.getElementById('concept');
            conceptInput.disabled = isChecked;
            if (isChecked) {
                conceptInput.value = "";
                conceptInput.placeholder = "Yapay zeka konsepti kendisi belirleyecek...";
            } else {
                conceptInput.placeholder = "Örn: Kek dükkânı, arsa çitleme, ahşap kesme...";
            }
        }

        function showStatus(msg, isError) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.style.background = isError ? '#f8d7da' : '#d4edda';
            statusDiv.style.color = isError ? '#721c24' : '#155724';
            statusDiv.innerText = msg;
        }

        async function generateToolWithRetry(endpoint, payload, retries = 3, delay = 3000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        const errMessage = data.error ? (typeof data.error === 'object' ? data.error.message : data.error) : "";
                        if ((response.status === 503 || errMessage.includes("high demand") || response.status === 429) && i < retries - 1) {
                            showStatus(`⚠️ Sunucu yoğun (Deneme ${i+1}/${retries}), bekleniyor...`, false);
                            await new Promise(res => setTimeout(res, delay));
                            continue;
                        }
                        throw new Error(errMessage || "API Hatası: " + response.status);
                    }
                    return data;
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay));
                }
            }
        }

        async function generateTool() {
            const modelName = document.getElementById('modelSelect').value;
            const grade = document.getElementById('grade').value;
            const subject = document.getElementById('subject').value;
            const subtopic = document.getElementById('subtopic').value;
            const isAutoConcept = document.getElementById('autoConcept').checked;
            const conceptInput = document.getElementById('concept').value.trim();
            const details = document.getElementById('details').value;
            const previewFrame = document.getElementById('previewFrame');

            if (!subtopic) {
                alert("Lütfen konu veya alt başlık alanını doldurun!");
                return;
            }

            const conceptInstruction = isAutoConcept 
                ? "Konsepte/Senaryoya Yapay Zeka karar versin (Günlük hayattan en somutlaştırıcı, eğlenceli ve konuya en uygun atölye veya dükkân senaryosunu kendin seç)." 
                : (conceptInput ? `İstenen Konsept / Senaryo: ${conceptInput}` : "Yapay zeka en uygun konsepti seçsin.");

            showStatus("⏳ Seçtiğiniz somutlaştırma atölyesi kodlanıyor...", false);
            
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write("<div style='font-family:sans-serif; text-align:center; padding-top:50px; color:#64748b;'><h3>🛠️ Yapay zeka atölye tezgahını hazırlıyor...</h3><p>Lütfen bekleyin...</p></div>");
            doc.close();

            const promptText = `
Sen uzman bir Eğitsel Simülasyon Tasarımcısı ve İnteraktif Web Geliştiricisisin. Sana verdiğim standart tasarım şablonunu, renk paletini ve CSS mimarisini BİREBİR KULLANARAK, belirtilen ders ve kazanıma özel **oynanabilir, test/soru formatında OLMAYAN, tamamen görsel ve interaktif bir atölye simülasyonu** üreteceksin.

PARAMETRELER:
- Sınıf Düzeyi: ${grade}
- Ders: ${subject}
- Konu / Alt Başlık: ${subtopic}
- Atölye Konsepti / Senaryo Talimatı: ${conceptInstruction}
- Ekstra İstekler: ${details}

ZORUNLU TASARIM VE SİMÜLASYON STANDARTLARI:

1. ASLA TEST VEYA 4 ŞIKLI SORU OLMASIN:
   - Bu araç çoktan seçmeli bir sınav değildir. Öğrencinin ekrandaki görsel nesnelere (kek dilimleri, tahta parçaları, arsa çitleri, koli kutuları vb.) tıklayarak, keserek, yerleştirerek veya sürükleyerek fiziksel deneyim kazandığı **aktif bir simülasyon** olmalıdır.
   - Tıpkı kek dükkânı örneğinde olduğu gibi; solda hammadde/nesne alanı, sağda müşteri/hedef alanı olmalı ve kullanıcı tıklayarak hedefi yerine getirmelidir.

2. KONTROL VE HUD STANDARTLARI:
   - Üst HUD: Skor (🏆 Puan) ve Hak (❤️ Haklar).
   - Arayüzde "Başlat" veya "Durdur" butonları OLMAYACAK. Bunun yerine doğrudan simülasyonu/tezgâhı sıfırlayan tek bir **"🔄 Yeniden Başlat"** (veya "Yeni Müşteri/Sipariş") butonu bulunmalıdır. Simülasyon açılır açılmaz aktif ve etkileşime hazır olmalıdır.

3. İKİ SEKMELİ YAPI:
   - **Sekme 1 (Atölye / Tezgâh Alanı):** Canlı interaktif simülasyon alanı.
   - **Sekme 2 (Pratik Bilgiler & Taktikler):** Konunun kurallarının ve püf noktalarının anlatıldığı rehber kartları.
   - Arayüzde veya bilgi kartlarında **asla ham LaTeX ($...$) kodu kullanılmayacak**; matematiksel ifadeler şık ve pürüzsüz HTML simgeleriyle (√, a², 1/2 vb.) gösterilecektir.

4. TEKNİK GEREKSİNİMLER:
   - Tek bir dosyada birleşmiş pürüzsüz HTML, CSS ve JavaScript. Harici kütüphane istemeyecek.
   - Görseller SVG veya temiz CSS şekilleriyle desteklenecek.

5. ÇIKTI FORMATI:
   - Yalnızca çalışan eksiksiz HAM HTML KODU döndür. Markdown (\`\`\`html vb.) kesinlikle kullanma.
`;

            try {
                // Vercel serverless fonksiyonumuza istek atıyoruz
                const endpoint = '/api/generate';
                
                const payload = {
                    promptText: promptText,
                    modelName: modelName
                };

                const data = await generateToolWithRetry(endpoint, payload);

                if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error("Model geçerli yanıt üretmedi.");
                }

                let rawCode = data.candidates[0].content.parts[0].text;
                rawCode = rawCode.replace(/^```html/gi, '').replace(/^```/gi, '').replace(/```$/gi, '').trim();

                lastGeneratedCode = rawCode;

                doc.open();
                doc.write(lastGeneratedCode);
                doc.close();

                showStatus("🎉 Somut atölye simülasyonu başarıyla üretildi!", false);

            } catch (err) {
                console.error(err);
                showStatus("❌ Hata: " + err.message, true);
            }
        }

        function downloadHTML() {
            if (!lastGeneratedCode) {
                alert("Önce bir atölye üretmelisiniz.");
                return;
            }
            
            const subtopicInput = document.getElementById('subtopic').value || "atolye";
            const safeName = subtopicInput.replace(/[^a-z0-9ğüşıöçĞÜŞİÖÇ]/gi, '_').toLowerCase();
            
            const blob = new Blob([lastGeneratedCode], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${safeName}_atolye.html`;
            a.click();
        }

        document.getElementById('btnGenerate').addEventListener('click', generateTool);
        document.getElementById('btnDownload').addEventListener('click', downloadHTML);
    </script>
</body>
</html>
