<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eğitici Akıllı Görsel Araç Üreteci</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f4f6f9; }
        .container { display: flex; gap: 20px; min-height: 85vh; }
        .form-panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .preview-panel { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
        button { background: #0284c7; color: white; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #0369a1; }
        iframe { width: 100%; height: 100%; border: none; flex: 1; border-radius: 4px; background: #fff; }
        #previewContainer { width: 100%; flex: 1; border: 1px solid #ccc; margin-top: 10px; border-radius: 4px; overflow: hidden; display: flex; }
        #status { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; text-align: center; }
    </style>
</head>
<body>

    <h2>🛠️ Eğitici Akıllı Görsel Araç Üreteci (Laboratuvar Konsepti)</h2>

    <div class="container">
        <!-- SOL PANEL -->
        <div class="form-panel">
            <label for="apiKey">Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="AIzaSy...">

            <label for="modelSelect">Model:</label>
            <select id="modelSelect">
                <option value="gemini-3.5-flash-lite" selected>gemini-3.5-flash-lite (Önerilen & Hızlı)</option>
                <option value="gemini-3.8-flash">gemini-3.8-flash (Yüksek Başarı)</option>
                <option value="gemini-3.6-flash" selected>gemini-3.6-flash</option>
            </select>

            <label for="grade">Sınıf Düzeyi:</label>
            <select id="grade">
                <option value="5. Sınıf">5. Sınıf</option>
                <option value="6. Sınıf">6. Sınıf</option>
                <option value="7. Sınıf">7. Sınıf</option>
                <option value="8. Sınıf" selected>8. Sınıf</option>
            </select>

            <label for="subject">Ders / Konu:</label>
            <input type="text" id="subject" placeholder="Örn: Fen Bilgisi - Hücre / İngilizce - Simple Past Tense">

            <label for="details">Özel İstekler:</label>
            <textarea id="details" rows="3" placeholder="Örn: Taban ve üssü değiştirilebilen interaktif görsel kart, üslü nicelik karşılaştırma sekmesi."></textarea>

            <button id="btnGenerate">✨ Konsept ile Uyumlu Araç Üret</button>
            <button id="btnDownload" style="background:#28a745; margin-top: 10px;">💾 HTML Olarak İndir</button>
            <div id="status"></div>
        </div>

        <!-- SAĞ PANEL -->
        <div class="preview-panel">
            <h3>📱 Canlı Önizleme</h3>
            <div id="previewContainer">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        let lastGeneratedCode = "";

        function showStatus(msg, isError) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.style.background = isError ? '#f8d7da' : '#d4edda';
            statusDiv.style.color = isError ? '#721c24' : '#155724';
            statusDiv.innerText = msg;
        }

        async function generateTool() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const modelName = document.getElementById('modelSelect').value;
            const grade = document.getElementById('grade').value;
            const subject = document.getElementById('subject').value;
            const details = document.getElementById('details').value;
            const previewFrame = document.getElementById('previewFrame');

            if (!apiKey) {
                alert("Lütfen geçerli bir Gemini API Key girin!");
                return;
            }

            // 1. Sol panelde uyarıyı göster
            showStatus("⏳ Örnek konsept formatına uygun araç kodlanıyor...", false);
            
            // 2. Önizleme iframe'ine yükleniyor mesajını bas
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write("<div style='font-family:sans-serif; text-align:center; padding-top:50px; color:#64748b;'><h3>⏳ Yapay zeka materyali standart formata göre kodluyor...</h3><p>Lütfen bekleyin...</p></div>");
            doc.close();

            const promptText = `
Sen uzman bir Eğitim Teknolojileri ve İnteraktif İçerik Geliştirme Yazılımcısısın. Sana verilen şablon mimarisini ve CSS tasarım dilini BİREBİR KULLANARAK, belirtilen ders ve konuya uygun yeni bir interaktif eğitim aracı üreteceksin.

PARAMETRELER:
- Sınıf Düzeyi: ${grade}
- Ders / Konu: ${subject}
- Özel Detaylar/İstekler: ${details}

Tasarım ve Kodlama Mimarisi Kuralları (Birebir Uygulanacak):
1. CSS TEMASI VE STİLLER:
   Şu CSS değişkenlerini ve genel stilleri mutlaka kullan:
   :root {
     --primary: #0284c7;
     --primary-hover: #0369a1;
     --bg: #f8fafc;
     --card: #ffffff;
     --text: #0f172a;
     --accent-green: #16a34a;
     --accent-red: #dc2626;
     --accent-purple: #9333ea;
     --accent-amber: #d97706;
   }
   Kart yapısı (.container, .visual-card, .quiz-card), Sekmeler (.tabs, .tab-btn), Panel kontrol grubu (.panel, .control-group), Çip stilleri (.chip, .pair-chips), Butonlar (.option-btn, .preset-btn) ve Bildirim Kutuları (.feedback) eldeki standart şablonla birebir aynı UI tasarımı taşımalıdır.

2. SEKMELİ YAPI (Tabs):
   Üst kısımda tam olarak bu yapıda 3 sekme ve geçiş JS fonksiyonu (switchTab) bulunacak:
   - Sekme 1: Konunun ana interaktif laboratuvarı, simülasyonu, modellemesi veya uygulama alanı (girilen parametrelere göre dinamik çalışan görsel/hesaplamalı/etkileşimli alan).
   - Sekme 2: Konunun temel kuralları, kavram haritası, karşılaştırma veya ikincil görsel analiz paneli.
   - Sekme 3: "5 Soruluk Test" (Detaylı cevap açıklamalı quiz).

3. 5 SORULUK QUIZ FORMATI:
   - quiz-card ve option-btn CSS sınıflarını kullan.
   - Her sorunun altında doğru/yanlış yapıldığında detaylı açıklama veren "checkQ(qId, btn, isCorrect)" yapısını ve "explanations" JS nesnesini oluştur.
   - Doğru şık tıklandığında buton yeşil (#dcfce7), yanlış şık tıklandığında kırmızı (#fee2e2) renk alsın ve detaylı açıklama kutusu görünsün.

4. PEDAGOJİK UYUM:
   - İçerik tamamen girilen dersin niteliğine uygun olmalıdır (Örn: Fen Bilimleri için deney simülasyonu/değişkenler, Yabancı Dil için kelime/cümle pratik araçları, Sosyal Bilgiler/Tarih için kronoloji veya olay analiz araçları, Türkçe için dilbilgisi/metin analiz araçları).

5. ÇIKTI FORMATI:
   - Yalnızca çalışan, eksiksiz, CSS ve JS kodları içerisinde tam olarak yazılmış HAM HTML KODU döndür.
   - Kodun başında veya sonunda Markdown (\`\`\`html vb.) kullanma.
`;

            try {
                const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + apiKey;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            role: "user",
                            parts: [{ text: promptText }]
                        }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error ? data.error.message : "API Hatası: " + response.status);
                }

                if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error("Model geçerli yanıt üretmedi.");
                }

                let rawCode = data.candidates[0].content.parts[0].text;
                rawCode = rawCode.replace(/^```html/gi, '').replace(/^```/gi, '').replace(/```$/gi, '').trim();

                lastGeneratedCode = rawCode;

                doc.open();
                doc.write(lastGeneratedCode);
                doc.close();

                showStatus("🎉 Şablonla %100 uyumlu araç başarıyla üretildi!", false);

            } catch (err) {
                console.error(err);
                showStatus("❌ Hata: " + err.message, true);
            }
        }

        function downloadHTML() {
            if (!lastGeneratedCode) {
                alert("Önce bir araç üretmelisiniz.");
                return;
            }
            
            // Konu alanındaki metni güvenli dosya adına dönüştür
            const subjectInput = document.getElementById('subject').value || "etkinlik";
            const safeSubjectName = subjectInput.replace(/[^a-z0-9ğüşıöçĞÜŞİÖÇ]/gi, '_').toLowerCase();
            
            const blob = new Blob([lastGeneratedCode], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${safeSubjectName}.html`;
            a.click();
        }

        // Tıklama olaylarını bağla
        document.getElementById('btnGenerate').addEventListener('click', generateTool);
        document.getElementById('btnDownload').addEventListener('click', downloadHTML);
    </script>
</body>
</html>
