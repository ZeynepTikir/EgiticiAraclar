<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitici Araçlar Portalı</title>
    <style>
        :root { --primary: #0284c7; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 30px 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: var(--primary); margin-bottom: 20px; text-align: center; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: 600; }
        .back-btn:hover { text-decoration: underline; }
        
        /* Eski ve şık ünite/araç kutusu stillerin */
        .unit-box { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .unit-box h3 { margin-bottom: 15px; color: #334155; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .tool-list { display: flex; flex-direction: column; gap: 10px; }
        .tool-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; text-decoration: none; color: var(--text); font-weight: 500; transition: all 0.2s; }
        .tool-item:hover { background: #f0f9ff; border-color: var(--primary); color: var(--primary); }

        /* Sınıf Seçim Ekranı İçin Grid Düzeni */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-decoration: none; color: var(--text); font-weight: bold; font-size: 1.2rem; transition: all 0.2s; border: 1px solid #e2e8f0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .card:hover { transform: translateY(-3px); border-color: var(--primary); background: #f0f9ff; color: var(--primary); }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" id="geriBtn">← Ana Sayfaya Dön</a>
    <h1 id="baslik">Yükleniyor...</h1>
    
    <div id="icerikContainer"></div>

    <script src="data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dersKey = urlParams.get('ders');
        const sinifKey = urlParams.get('sinif');

        const container = document.getElementById('icerikContainer');
        const baslikEl = document.getElementById('baslik');
        const geriBtn = document.getElementById('geriBtn');

        if (typeof egitimVerileri !== 'undefined' && dersKey && egitimVerileri[dersKey]) {
            const dersData = egitimVerileri[dersKey];

            // DURUM 1: Sınıf seçilmediyse -> O dersin Sınıf Seviyelerini Göster
            if (!sinifKey) {
                baslikEl.innerText = `${dersData.ikon} ${dersData.baslik}`;
                document.title = dersData.baslik;
                geriBtn.href = "index.html";
                geriBtn.innerText = "← Ana Sayfaya Dön";

                let gridDiv = document.createElement('div');
                gridDiv.className = 'grid';

                for (const [sKey, sBilgi] of Object.entries(dersData.siniflar)) {
                    const card = document.createElement('a');
                    card.href = `sinif.html?ders=${dersKey}&sinif=${sKey}`;
                    card.className = 'card';
                    card.innerHTML = `<span style="font-size: 2rem;">📚</span> <span>${sBilgi.baslik}</span>`;
                    gridDiv.appendChild(card);
                }
                container.appendChild(gridDiv);
            } 
            // DURUM 2: Sınıf seçildiyse -> Senin gönderdiğin orijinal eski düzeni (Üniteler ve Araçlar) çalıştır
            else if (dersData.siniflar[sinifKey]) {
                const sinifData = dersData.siniflar[sinifKey];
                
                document.title = sinifData.baslik;
                baslikEl.innerText = sinifData.baslik;
                
                // Geri butonunu o dersin sınıf listesine dönecek şekilde ayarla
                geriBtn.href = `sinif.html?ders=${dersKey}`;
                geriBtn.innerText = `← ${dersData.baslik} Sınıf Seçimine Dön`;

                sinifData.uniteler.forEach(unite => {
                    let unitDiv = document.createElement('div');
                    unitDiv.className = 'unit-box';
                    
                    let toolsHtml = "";
                    if (unite.araclar && unite.araclar.length > 0) {
                        toolsHtml = unite.araclar.map(arac => `
                            <a href="${arac.dosya}" class="tool-item">
                                <span>🧩 ${arac.ad}</span>
                                <span>▶ Başlat</span>
                            </a>
                        `).join('');
                    } else {
                        toolsHtml = `<p style="color: #94a3b8; font-size: 0.9rem; padding: 5px;">Bu ünitede henüz etkinlik bulunmuyor.</p>`;
                    }

                    unitDiv.innerHTML = `
                        <h3>📂 ${unite.uniteAdi}</h3>
                        <div class="tool-list">${toolsHtml}</div>
                    `;
                    container.appendChild(unitDiv);
                });
            } else {
                baslikEl.innerText = "Sınıf Bulunamadı!";
                container.innerHTML = "<p style='text-align:center; color:#64748b;'>Aradığınız sınıf bu derste bulunamadı.</p>";
            }
        } else {
            baslikEl.innerText = "İçerik Bulunamadı!";
            container.innerHTML = "<p style='text-align:center; color:#64748b;'>Geçersiz ders seçimi veya data.js yüklenemedi.</p>";
        }
    </script>
</body>
</html>
