<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitici Araçlar - Sınıf Seçimi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; text-align: center; padding: 40px; }
        h1 { color: #0284c7; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-decoration: none; color: #0f172a; font-weight: bold; font-size: 1.2rem; transition: transform 0.2s, background 0.2s; border: 1px solid #e2e8f0; }
        .card:hover { transform: translateY(-5px); background: #f0f9ff; color: #0284c7; border-color: #0284c7; }
    </style>
</head>
<body>
    <h1>Eğitici Araçlar Portalı</h1>
    <p style="color: #64748b; margin-bottom: 40px;">Lütfen sınıf seviyesini seçiniz:</p>
    
    <div class="grid">
        <a href="5_sinif/index.html" class="card">5. Sınıf</a>
        <a href="6_sinif/index.html" class="card">6. Sınıf</a>
        <a href="7_sinif/index.html" class="card">7. Sınıf</a>
        <a href="8_sinif/index.html" class="card">8. Sınıf</a>
    </div>
</body>
</html>
