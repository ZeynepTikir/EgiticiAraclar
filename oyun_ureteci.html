<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eğitici Akıllı Oyun Üreteci</title>
    <style>
        :root { --game: #d97706; --game-hover: #b45309; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f8fafc; }
        .container { display: flex; gap: 20px; min-height: 85vh; }
        .form-panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-y: auto; max-height: 85vh; }
        .preview-panel { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        label { font-weight: bold; margin-top: 12px; display: block; color: #0f172a; font-size: 0.95rem; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { background: var(--game); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background: var(--game-hover); }
        iframe { width: 100%; height: 100%; border: none; flex: 1; border-radius: 4px; background: #fff; }
        #previewContainer { width: 100%; flex: 1; border: 1px solid #ccc; margin-top: 10px; border-radius: 4px; overflow: hidden; display: flex; }
        #status { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; text-align: center; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #64748b; text-decoration: none; font-weight: bold; }
        .back-link:hover { color: var(--game); }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Portala Dön</a>
    <h2>🎮 Eğitici Akıllı Oyun Üreteci (Standart Mimari)</h2>

    <div class="container">
        <!-- SOL PANEL -->
        <div class="form-panel">
            <label for="apiKey">Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="AIzaSy...">

            <label for="modelSelect">Model Seçiniz:</label>
<select id="modelSelect">
    <option value="gemini-3.5-flash-lite" selected>gemini-3.5-flash-lite (Hızlı & Kota Uygun)</option>
    <option value="gemini-3.8-flash">gemini-3.8-flash (Yüksek Başarı)</option>
    <option value="gemini-3-flash">gemini-3-flash (Alternatif)</option>
    <option value="gemini-2.5-flash">gemini-2.5-flash</option>
    <option value="gemini-3.6-flash">gemini-3.6-flash (Popüler)</option>
</select>

            <label for="grade">Sınıf Düzeyi:</label>
            <select id="grade">
                <option value="5. Sınıf">5. Sınıf</option>
                <option value="6. Sınıf">6. Sınıf</option>
                <option value="7. Sınıf">7. Sınıf</option>
                <option value="8. Sınıf" selected>8. Sınıf</option>
            </select>

            <label for="subject">Ders / Konu:</label>
            <input type="text" id="subject" placeholder="Örn: Matematik - Kareköklü İfadeler">

            <label for="subtopic">Alt Başlık / Kazanım:</label>
            <input type="text" id="subtopic" placeholder="Örn: Karekökün hangi iki tam sayı arasında olduğunu bulma">

            <label for="concept">Görsel / Karakter Konsepti:</label>
            <select id="concept">
                <option value="Robot (Teknolojik, animasyonlu göz/anten tepkileri)" selected>🤖 Robot (Teknolojik & Eğlenceli)</option>
                <option value="Sevgi Dolu Balık (Su altı dünyası, yüzme animasyonları)">🐠 Sevgi Dolu Balık (Su Altı Teması)</option>
                <option value="Mutlu Çiçek (Yaprak açma ve güneş enerjisi teması)">🌻 Mutlu Çiçek (Doğa & Büyüme Teması)</option>
                <option value="Uzay Roketi (Galaksi ve yıldızlar arasında macera)">🚀 Uzay Roketi (Galaksi Teması)</option>
                <option value="Sevimli Kedi (Mırıldanan ve neşeli pati teması)">🐱 Sevimli Kedi (Hayvan Dostu Tema)</option>
            </select>

            <label for="details">Ekstra Özel İstekler (Opsiyonel):</label>
            <textarea id="details" rows="2" placeholder="Örn: Sayı doğrusu görseli de eşlik etsin."></textarea>

            <button id="btnGenerate">🚀 Standart Mimaride Mini Oyun Üret</button>
            <button id="btnDownload" style="background:#059669; margin-top: 10px;">💾 Oyunu HTML Olarak İndir</button>
            <div id="status"></div>
        </div>

        <!-- SAĞ PANEL -->
        <div class="preview-panel">
            <h3>📱 Canlı Oyun Önizlemesi</h3>
            <div id="previewContainer">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        let lastGeneratedCode = "";

        function showStatus(msg, isError) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.style.background = isError ? '#f8d7da' : '#d4edda';
            statusDiv.style.color = isError ? '#721c24' : '#155724';
            statusDiv.innerText = msg;
        }

        async function generateTool() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const modelName = document.getElementById('modelSelect').value;
            const grade = document.getElementById('grade').value;
            const subject = document.getElementById('subject').value;
            const subtopic = document.getElementById('subtopic').value;
            const concept = document.getElementById('concept').value;
            const details = document.getElementById('details').value;
            const previewFrame = document.getElementById('previewFrame');

            if (!apiKey) {
                alert("Lütfen geçerli bir Gemini API Key girin!");
                return;
            }

            if (!subject || !subtopic) {
                alert("Lütfen Ders/Konu ve Alt Başlık alanlarını doldurun!");
                return;
            }

            showStatus("⏳ Seçtiğiniz standart şablona göre oyun kodlanıyor...", false);
            
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write("<div style='font-family:sans-serif; text-align:center; padding-top:50px; color:#64748b;'><h3>🎮 Yapay zeka standart mimariyi kuruyor...</h3><p>Lütfen bekleyin...</p></div>");
            doc.close();

            const promptText = `
Sen uzman bir Eğitsel Etkileşim ve Oyun Tasarımcısısın. Sana verdiğim standart tasarım şablonunu, renk paletini ve CSS mimarisini BİREBİR KULLANARAK, belirtilen ders ve konuya özel **oynanabilir, kusursuz bir eğitici mini etkinlik / oyun** üreteceksin.

PARAMETRELER:
- Sınıf Düzeyi: ${grade}
- Ders / Konu: ${subject}
- Alt Başlık / Kazanım: ${subtopic}
- Görsel / Karakter Konsepti: ${concept}
- Ekstra İstekler: ${details}

ZORUNLU TASARIM VE KODLAMA STANDARTLARI (BİREBİR UYGULANACAK):

1. TASARIM DİLİ VE CSS MİMARİSİ:
   - Google Fonts ('Fredoka' ve 'Nunito') kullanılacak.
   - Arka plan nokta desenli hafif dokulu grid (#f8fafc).
   - Kartlar border: 3px solid #e2e8f0; border-radius: 24px; ve yumuşak gölgeli olacak.
   - Renk paleti: --primary (#0284c7), --accent-green (#16a34a), --accent-red (#dc2626), --accent-purple (#9333ea), --accent-amber (#d97706).

2. KONTROL VE HUD MEKANİĞİ:
   - Arayüzde net bir şekilde **"▶️ Başlat"** ve **"⏸️ Durdur"** butonları bulunacak. 
   - **Kritik Kural:** "Durdur" butonuna basıldığında oyun askıya alınmalı ancak **skor ve can (hak) bilgileri asla sıfırlanmamalıdır**. Tekrar "Başlat/Devam Et" dendiği yerden devam etmelidir.
   - Üst HUD panelinde Skor (🏆 Puan) ve Can (❤️ Haklar) yer alacak.

3. İKİ SEKMELİ YAPI (Tabs):
   - **Sekme 1 (Oyun / Etkileşim Alanı):** Sadece şıklı bir test/yarışma olmayacak. Girilen konunun niteliğine tam oturan, esnek bir mekanik (sürükle-bırak eşleştirme, fabrika/makine simülasyonu, hedef yakalama veya kart seçme) içerecek. Doğru hamlelerde karakter/konsept animasyonları ve puan artışı, yanlışlarda can azalması yaşanacak.
   - **Sekme 2 (Pratik Bilgiler / Taktikler):** Konunun formüllerinin ve ipuçlarının yer aldığı şık kartlar. **Önemli:** Matematiksel ifadeler veya formüller tarayıcının doğrudan okuyabileceği şekilde (örn: √(a² · b) = a√b veya doğrudan simgelerle) yazılacak, asla ham LaTeX ($...$) kodları ekranda düz metin olarak bırakılmayacak.

4. ETKİLEŞİM VE POP-UP MODAL:
   - Haklar bittiğinde şık bir pop-up Modal (Özet puan ve "Tekrar Oyna" butonuyla) açılacak ve reset butonunda skor/can sıfırlanacak.

5. ÇIKTI FORMATI:
   - Yalnızca çalışan, tek bir dosyada birleşmiş, harici kütüphane istemeyen ham HTML, CSS ve JS kodlarını içeren eksiksiz HAM HTML KODU döndür.
   - Kodun başında veya sonunda Markdown (\`\`\`html vb.) kesinlikle kullanma.
`;

            try {
                const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + apiKey;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            role: "user",
                            parts: [{ text: promptText }]
                        }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error ? data.error.message : "API Hatası: " + response.status);
                }

                if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error("Model geçerli yanıt üretmedi.");
                }

                let rawCode = data.candidates[0].content.parts[0].text;
                rawCode = rawCode.replace(/^```html/gi, '').replace(/^```/gi, '').replace(/```$/gi, '').trim();

                lastGeneratedCode = rawCode;

                doc.open();
                doc.write(lastGeneratedCode);
                doc.close();

                showStatus("🎉 Standart mimariyle oyun başarıyla üretildi!", false);

            } catch (err) {
                console.error(err);
                showStatus("❌ Hata: " + err.message, true);
            }
        }

        function downloadHTML() {
            if (!lastGeneratedCode) {
                alert("Önce bir oyun üretmelisiniz.");
                return;
            }
            
            const subjectInput = document.getElementById('subject').value || "egitici_oyun";
            const safeSubjectName = subjectInput.replace(/[^a-z0-9ğüşıöçĞÜŞİÖÇ]/gi, '_').toLowerCase();
            
            const blob = new Blob([lastGeneratedCode], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${safeSubjectName}_oyun.html`;
            a.click();
        }

        document.getElementById('btnGenerate').addEventListener('click', generateTool);
        document.getElementById('btnDownload').addEventListener('click', downloadHTML);
    </script>
</body>
</html>
