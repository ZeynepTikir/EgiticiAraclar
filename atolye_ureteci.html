<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eğitici Akıllı Simülasyon Üreteci</title>
    <style>
        :root { --game: #d97706; --game-hover: #b45309; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f8fafc; }
        .container { display: flex; gap: 20px; min-height: 85vh; }
        .form-panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-y: auto; max-height: 85vh; }
        .preview-panel { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        label { font-weight: bold; margin-top: 12px; display: block; color: #0f172a; font-size: 0.95rem; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { background: var(--game); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background: var(--game-hover); }
        iframe { width: 100%; height: 100%; border: none; flex: 1; border-radius: 4px; background: #fff; }
        #previewContainer { width: 100%; flex: 1; border: 1px solid #ccc; margin-top: 10px; border-radius: 4px; overflow: hidden; display: flex; }
        #status { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; text-align: center; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #64748b; text-decoration: none; font-weight: bold; }
        .back-link:hover { color: var(--game); }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Portala Dön</a>
    <h2>🍰 Eğitici Akıllı Simülasyon Üreteci (Atölye Modu)</h2>

    <div class="container">
        <!-- SOL PANEL -->
        <div class="form-panel">
            <label for="apiKey">Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="AIzaSy...">

            <label for="modelSelect">Model Seçiniz:</label>
            <select id="modelSelect">
                <option value="gemini-3.5-flash-lite" selected>gemini-3.5-flash-lite (Önerilen & Hızlı)</option>
                <option value="gemini-3.8-flash">gemini-3.8-flash (Yüksek Kapasite)</option>
                <option value="gemini-3-flash">gemini-3-flash</option>
            </select>

            <label for="grade">Sınıf Düzeyi:</label>
            <select id="grade">
                <option value="5. Sınıf">5. Sınıf</option>
                <option value="6. Sınıf">6. Sınıf</option>
                <option value="7. Sınıf">7. Sınıf</option>
                <option value="8. Sınıf" selected>8. Sınıf</option>
            </select>

            <label for="subject">Ders / Konu:</label>
            <input type="text" id="subject" placeholder="Örn: Matematik - EBOB / EKOK veya Karekök">

            <label for="subtopic">Alt Başlık / Kazanım:</label>
            <input type="text" id="subtopic" placeholder="Örn: İki çubuktan eşit boyda parçalar oluşturma (EBOB)">

            <label for="simulationType">Atölye / Simülasyon Senaryosu:</label>
            <select id="simulationType">
                <option value="Atölye / Dilimleme / Kesme Simülasyonu (Örn: Kek, Tahta, Kumaş)">🍰 Dilimleme & Parçalama Atölyesi (Kesirler / EBOB)</option>
                <option value="Arsa / Çit Çekme & Sınır Simülasyonu (Örn: Karekök / Alan)">🏡 Arsa & Çit Tasarım Atölyesi (Karekök / Alan)</option>
                <option value="Depo / Koli İstifleme Simülasyonu (Örn: Üslü Sayılar)">📦 Depo & Koli İstifleme Fabrikası (Üslü Sayılar)</option>
                <option value="Zaman / Saat Senkronizasyon Simülasyonu (Örn: EKOK)">⏰ Kronometre & Buluşma Atölyesi (EKOK)</option>
                <option value="Serbest / Konuya Uygun Görsel Simülasyon">✨ Akıllı Konu Simülasyonu (Yapay Zeka Seçsin)</option>
            </select>

            <label for="details">Ekstra Özel İstekler (Opsiyonel):</label>
            <textarea id="details" rows="2" placeholder="Örn: Müşteriler gelsin, doğru parçaları tabağa/alana yerleştirelim."></textarea>

            <button id="btnGenerate">🚀 İnteraktif Simülasyon Üret</button>
            <button id="btnDownload" style="background:#059669; margin-top: 10px;">💾 Simülasyonu HTML Olarak İndir</button>
            <div id="status"></div>
        </div>

        <!-- SAĞ PANEL -->
        <div class="preview-panel">
            <h3>📱 Canlı Simülasyon Önizlemesi</h3>
            <div id="previewContainer">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        let lastGeneratedCode = "";

        function showStatus(msg, isError) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.style.background = isError ? '#f8d7da' : '#d4edda';
            statusDiv.style.color = isError ? '#721c24' : '#155724';
            statusDiv.innerText = msg;
        }

        async function generateToolWithRetry(endpoint, payload, retries = 3, delay = 3000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        const errMessage = data.error ? data.error.message : "";
                        if ((response.status === 503 || errMessage.includes("high demand") || response.status === 429) && i < retries - 1) {
                            showStatus(`⚠️ Sunucu yoğun (Deneme ${i+1}/${retries}), bekleniyor...`, false);
                            await new Promise(res => setTimeout(res, delay));
                            continue;
                        }
                        throw new Error(errMessage || "API Hatası: " + response.status);
                    }
                    return data;
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay));
                }
            }
        }

        async function generateTool() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const modelName = document.getElementById('modelSelect').value;
            const grade = document.getElementById('grade').value;
            const subject = document.getElementById('subject').value;
            const subtopic = document.getElementById('subtopic').value;
            const simulationType = document.getElementById('simulationType').value;
            const details = document.getElementById('details').value;
            const previewFrame = document.getElementById('previewFrame');

            if (!apiKey) {
                alert("Lütfen geçerli bir Gemini API Key girin!");
                return;
            }

            if (!subject || !subtopic) {
                alert("Lütfen Ders/Konu ve Alt Başlık alanlarını doldurun!");
                return;
            }

            showStatus("⏳ Seçtiğiniz atölye simülasyonu kodlanıyor...", false);
            
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write("<div style='font-family:sans-serif; text-align:center; padding-top:50px; color:#64748b;'><h3>🛠️ Yapay zeka simülasyon tezgahını kuruyor...</h3><p>Lütfen bekleyin...</p></div>");
            doc.close();

            const promptText = `
Sen uzman bir Eğitsel Simülasyon Tasarımcısı ve İnteraktif Web Geliştiricisisin. Sana verdiğim standart tasarım şablonunu, renk paletini ve CSS mimarisini BİREBİR KULLANARAK, belirtilen ders ve kazanıma özel **oynanabilir, test/soru formatında OLMAYAN, tamamen görsel ve interaktif bir atölye simülasyonu** üreteceksin.

PARAMETRELER:
- Sınıf Düzeyi: ${grade}
- Ders / Konu: ${subject}
- Alt Başlık / Kazanım: ${subtopic}
- Simülasyon/Atölye Türü: ${simulationType}
- Ekstra İstekler: ${details}

ZORUNLU TASARIM VE SİMÜLASYON STANDARTLARI:

1. ASLA TEST VEYA 4 ŞIKLI SORU OLMASIN:
   - Bu araç bir çoktan seçmeli sınav değildir. Öğrencinin ekrandaki görsel nesnelere (kek dilimleri, tahta parçaları, arsa çitleri, koli kutuları vb.) tıklayarak, keserek, yerleştirerek veya eşleştirerek fiziksel deneyim kazandığı **aktif bir simülasyon** olmalıdır.
   - Kek dükkânı örneğinde olduğu gibi; solda hammadde/nesne, sağda müşteri/hedef alanı ve kullanıcı tıklayarak hedefi yerine getirmelidir.

2. ARAYÜZ VE 2 SEKMELİ YAPI:
   - **Üst HUD:** Skor (🏆 Puan) ve Hak (❤️ Haklar). Başlat / Durdur butonları (Durdurulduğunda asla skor/hak sıfırlanmaz).
   - **Sekme 1 (Atölye / Simülasyon Alanı):** Canlı interaktif alan. Müşteri istekleri veya görevler belirir, kullanıcı görsel olarak çözer.
   - **Sekme 2 (Pratik Bilgiler & Formüller):** Konunun temel kurallarının net ve pürüzsüz anlatıldığı rehber kartları.
   - Asla ham LaTeX ($...$) kodu kullanılmayacak; matematiksel ifadeler düz ve şık HTML simgeleriyle (√, a², 1/2 vb.) yazılacak.

3. TEKNİK GEREKSİNİMLER:
   - Tek bir dosyada birleşmiş pürüzsüz HTML, CSS ve JavaScript. Harici kütüphane istemeyecek.
   - Görseller SVG veya temiz CSS şekilleriyle desteklenecek.

4. ÇIKTI FORMATI:
   - Yalnızca çalışan eksiksiz HAM HTML KODU döndür. Markdown (\`\`\`html vb.) kesinlikle kullanma.
`;

            try {
                const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + apiKey;
                
                const payload = {
                    contents: [{
                        role: "user",
                        parts: [{ text: promptText }]
                    }]
                };

                const data = await generateToolWithRetry(endpoint, payload);

                if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error("Model geçerli yanıt üretmedi.");
                }

                let rawCode = data.candidates[0].content.parts[0].text;
                rawCode = rawCode.replace(/^```html/gi, '').replace(/^```/gi, '').replace(/```$/gi, '').trim();

                lastGeneratedCode = rawCode;

                doc.open();
                doc.write(lastGeneratedCode);
                doc.close();

                showStatus("🎉 İnteraktif simülasyon başarıyla üretildi!", false);

            } catch (err) {
                console.error(err);
                showStatus("❌ Hata: " + err.message, true);
            }
        }

        function downloadHTML() {
            if (!lastGeneratedCode) {
                alert("Önce bir simülasyon üretmelisiniz.");
                return;
            }
            
            const subjectInput = document.getElementById('subject').value || "simulasyon";
            const safeSubjectName = subjectInput.replace(/[^a-z0-9ğüşıöçĞÜŞİÖÇ]/gi, '_').toLowerCase();
            
            const blob = new Blob([lastGeneratedCode], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${safeSubjectName}_simulasyon.html`;
            a.click();
        }

        document.getElementById('btnGenerate').addEventListener('click', generateTool);
        document.getElementById('btnDownload').addEventListener('click', downloadHTML);
    </script>
</body>
</html>
